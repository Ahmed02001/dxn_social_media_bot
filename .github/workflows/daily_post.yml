name: DXN Daily Post

"on":
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove conflicting packages
        run: |
          pip uninstall -y google-generativeai google-ai-generativelanguage || true

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify installation
        run: python -c "from google import genai; print('✅ google-genai imported successfully')"

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          POST_TIME: "08:00"
        run: python main.py
