name: DXN Daily Post

"on":
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai==1.16.0 python-dotenv requests schedule Pillow

      - name: Verify google-genai
        run: |
          python -c "import google.genai as genai; print('✅ OK:', genai.__version__)"

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          POST_TIME: "08:00"
        run: python main.py
